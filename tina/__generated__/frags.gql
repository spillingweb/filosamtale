fragment PagesParts on Pages {
  __typename
  ... on PagesHomepage {
    heroImage
    kicker
    title
    subtitle
    stat1Value
    stat1Label
    stat2Value
    stat2Label
    stat3Value
    stat3Label
    servicesHeading
    aboutName
    aboutText1
    aboutText2
    profileImage
    testimonials {
      __typename
      quote
      name
      role
    }
    blogHeading
    ctaTitle
    ctaDescription
  }
  ... on PagesStandard {
    title
    subtitle
    intro
    profileImage
    body
    verdier {
      __typename
      tittel
      tekst
    }
  }
  ... on PagesHeader {
    title
    intro
  }
  ... on PagesServices {
    title
    subtitle
    intro
    infoBadge
    faq {
      __typename
      question
      answer
    }
  }
  ... on PagesKontakt {
    title
    kicker
    heading
    description
    addressLine1
    addressLine2
    addressLine3
    email
    phone
    facebook
    instagram
    whatsapp
  }
}

fragment UtdanningParts on Utdanning {
  __typename
  ar
  grad
  sted
}

fragment TjenesterParts on Tjenester {
  __typename
  malgruppe
  orden
  image
  tittel
  badge
  undertittel
  description
  detaljer
  priser {
    __typename
    label
    pris
  }
}

fragment BloggParts on Blogg {
  __typename
  title
  excerpt
  date
  category
  readingTime
  coverImage
  body
}

fragment ArrangementerParts on Arrangementer {
  __typename
  title
  description
  image
  date
  endDate
  time
  location
  price
  capacity
  kategorier {
    ... on Kategorier {
      __typename
      value
      label
    }
    ... on Document {
      _sys {
        filename
        basename
        hasReferences
        breadcrumbs
        path
        relativePath
        extension
      }
      id
    }
  }
  isOnline
}

fragment KategorierParts on Kategorier {
  __typename
  value
  label
}
